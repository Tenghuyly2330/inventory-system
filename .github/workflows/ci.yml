name: CI Pineline

on:
      push: 
            branches: ['main']
      pull_request:
            branches: ["main"]

jobs:
      # backend
      backend: 
            name: Backend CI
            runs-on: ubuntu-latest

            defaults:
                  run: 
                        working-directory: ./backend

            steps: 
                  #checkout
                  - name: Checkout code
                    uses: actions/checkout@v4

                  # setup
                  - name: Setup nodejs
                    uses: actions/setup-node@v4
                    with: 
                        node-version: "24"
                        cache: "npm"
                        cache-dependency-path: "backend/package-lock.json" 

                  - name: install dependency
                    run: npm ci

      # frontend
      frontend:
            name: Frontend ci
            runs-on: ubuntu-latest

            defaults: 
                 run: 
                        working-directory: ./frontend

            steps: 
                  - name: checkout code 
                    uses: actions/checkout@v4

                  # setup
                  - name: setup nodejs
                    uses: actions/setup-node@v4
                    with: 
                        node-version: "24"
                        cache: "npm"
                        cache-dependency-path: "frontend/package-lock.json"
                  
                  # install dependency
                  - name: Install dependency
                    run: npm ci
                  
                  # build
                  - name: Build
                    run: npm run build